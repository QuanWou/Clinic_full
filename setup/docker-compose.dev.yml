services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic_team_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup/setup-dev.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - clinic_team_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic_team_dev"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  clinic_team_data:
